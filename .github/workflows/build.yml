name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          clang --version
          xcodebuild -version

      - name: Build, ad-hoc sign and run offline tests
        run: ./build.sh

      - name: Upload driver bundle
        uses: actions/upload-artifact@v4
        with:
          name: CamMicLinkMic-driver
          path: build/CamMicLinkMic.driver
          if-no-files-found: error

      - name: Upload offline test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-results
          path: artifacts/offline-test-results.txt
          if-no-files-found: warn
